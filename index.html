<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>
        <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="container">
    
        <header class="header">
         <div class="header_title">
            <span class="logo">
               <svg
              viewBox="0 0 24 24"
              width="30"
              height="30"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
            <rect x="3" y="3" width="18" height="18" rx="3" />
              <path d="M8 12l3 3 5-6" />
              </svg>
         </span>
             <h1>Daily Task Manager</h1>
         </div>
           <p class="header_sub">stay organized and productive with your daily task</p>
         
        </header>
     
    <section class="stats">
        <div class="stat">
          <strong id="stat-total">1</strong><span>Total Tasks</span>
        </div>
        <div class="stat stat-blue">
          <strong id="stat-active">1</strong><span>Active</span>
        </div>
        <div class="stat stat-green">
          <strong id="stat-completed">0</strong><span>Completed</span>
        </div>
        <div class="stat stat-purple">
          <strong id="stat-progress">0%</strong><span>Progress</span>
        </div>
      </section>

      <div class="bar">
         <div id="bar-fill" class="bar_fill">

         </div>
      </div>

            <button>+ Add New Task</button>
       <section>
        <div><input type="text" placeholder="Search tasks"></div>
         <div>
                <button>All Tasks <span><strong>1</strong></span></button>
                <button>Active <span><strong>1</strong></span></button>
                <button>Completed</button>
        </div>
   </section>

   <section>
        <div>
                <ul> </ul>
                <p>No Task Found Please Click Add New Task Button.</p>
        </div>
   </section>
        
     </div>
</body> 
</html>
