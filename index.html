<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Task Manager</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- HEADER -->
      <header class="header">
        <div class="header_title">
          <span class="logo">
            <svg
              viewBox="0 0 24 24"
              width="30"
              height="30"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <path d="M8 12l3 3 5-6" />
            </svg>
          </span>
          <h1>Daily Task Manager</h1>
        </div>
        <p class="header_sub">
          Stay organized and productive with your daily tasks
        </p>
      </header>

      <!-- STATS -->
      <section class="stats">
        <div class="stat">
          <strong id="stat-total">0</strong><span>Total Tasks</span>
        </div>
        <div class="stat stat-blue">
          <strong id="stat-active">0</strong><span>Active</span>
        </div>
        <div class="stat stat-green">
          <strong id="stat-completed">0</strong><span>Completed</span>
        </div>
        <div class="stat stat-purple">
          <strong id="stat-progress">0%</strong><span>Progress</span>
        </div>
      </section>

      <!-- PROGRESS BAR -->
      <div class="bar"><div id="bar-fill" class="bar_fill"></div></div>

      <!-- ADD BUTTON -->
      <button class="add-btn" id="open-modal">
        <svg
          viewBox="0 0 24 24"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
        Add New Task
      </button>

      <!-- SEARCH + FILTERS -->
      <section class="toolbar">
        <div class="search">
          <svg
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
          <input
            id="search-input"
            type="text"
            placeholder="Search tasks..."
            autocomplete="off"
          />
        </div>
        <div class="filters">
          <button class="filter filter--active" data-filter="all">
            All Tasks <span id="count-all" class="badge">0</span>
          </button>
          <button class="filter" data-filter="active">
            Active <span id="count-active" class="badge">0</span>
          </button>
          <button class="filter" data-filter="completed">
            Completed <span id="count-completed" class="badge">0</span>
          </button>
        </div>
      </section>

      <!-- TASK LIST (JavaScript fills this) -->
      <ul class="task-list" id="task-list"></ul>
      <p class="empty" id="empty-message">
        No tasks found. Click "Add New Task" to create one.
      </p>
    </div>

    <!-- POPUP FORM -->
    <div id="modal" class="modal">
      <form id="task-form" class="modal__box">
        <h2>New Task</h2>

        <label for="title-input">Task name</label>
        <input
          id="title-input"
          type="text"
          maxlength="80"
          placeholder="e.g. Revise Java OOP Concepts"
          autocomplete="off"
        />
        <p id="error-message" class="error"></p>

        <div class="row">
          <div>
            <label for="priority-input">Priority</label>
            <select id="priority-input">
              <option value="high">High</option>
              <option value="medium" selected>Medium</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div>
            <label for="category-input">Category</label>
            <select id="category-input">
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Personal">Personal</option>
              <option value="Health">Health</option>
            </select>
          </div>
        </div>

        <label for="due-input">Due date</label>
        <input id="due-input" type="date" />

        <div class="modal__actions">
          <button type="button" id="cancel-btn" class="btn btn--light">
            Cancel
          </button>
          <button type="submit" class="btn btn--primary">Add Task</button>
        </div>
      </form>
    </div>

    <script src="index.js"></script>
  </body>
</html>
